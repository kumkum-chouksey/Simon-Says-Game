<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Says</title>
  <link rel="stylesheet" href="Simon.css">
</head>
<body>
  <h1>Simon Says Game</h1>
  <h3>Press any key to start the Game</h3>
  <div class="btn-container">
    <div class="line1">
      <div type="button" class="btn red" id="red">1</div>
      <div type="button" class="btn blue" id="blue">2</div>
    </div>
    <div class="line2 ">
      <div type="button" class="btn green" id="green">3</div>
      <div type="button" class="btn purple" id="purple">4</div>
    </div>
  </div>
  <script src="Simon.js"></script>
</body>
</html>
